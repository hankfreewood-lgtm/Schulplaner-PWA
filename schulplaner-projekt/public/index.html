<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schulplaner">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Schulplaner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--r:12px;--sw:208px;--bg:#09090b;--card:#141417;--card2:#1e1e23;--line:rgba(255,255,255,.07);--txt:#f5f5f7;--mut:#8b8b95;--ok:#30d158;--acc:#0a84ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;border-radius:var(--r);-webkit-tap-highlight-color:transparent}
html,body,#app,header,main,.ov,.pov{border-radius:0}
html{background:radial-gradient(110% 50% at 50% -8%,rgba(10,132,255,.17),transparent 62%) no-repeat,var(--bg)}
html,body{margin:0;height:100%;color:var(--txt);font-family:'DM Sans',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{transition:transform .15s,opacity .2s,background .2s,color .2s,border-color .2s}
#app{max-width:760px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 20px 6px}
.kick{font-size:12px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
h1{font-size:32px;margin:0;font-weight:700;letter-spacing:-1px;line-height:1.05;animation:in .5s both}
.hr{display:flex;align-items:center;gap:12px;padding-bottom:4px}
.st{width:9px;height:9px;border-radius:2px;background:var(--ok);animation:pulse 2.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(48,209,88,.45)}50%{box-shadow:0 0 0 6px rgba(48,209,88,0)}}
.av{width:38px;height:38px;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:14px}
main{flex:1;overflow-y:auto;padding:6px 16px 170px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
h2{font-size:11.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--mut);margin:24px 2px 10px;font-weight:600}
.grid{border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12)}.exp{animation:in .3s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fresh>*,.fresh .rw,.fresh .lr{animation:in .45s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0)*45ms)}
.fresh.x>*,.fresh.x .rw,.fresh.x .lr{animation-name:inx}
@keyframes inx{from{opacity:0;transform:translateX(calc(var(--dx,0)*26px))}to{opacity:1;transform:none}}
.card{position:relative;padding:11px 2px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:opacity .3s,background .15s}
.card:active{background:rgba(255,255,255,.04)}
.card.done{opacity:.5}.card.done .t{text-decoration:line-through}
.cb{width:24px;height:24px;border:2px solid var(--c,var(--mut));background:none;flex:none;display:grid;place-items:center;cursor:pointer;padding:0}
.cb:active{transform:scale(.85)}
.done .cb{background:var(--c)}
.cb svg{width:14px}.cb path{stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s .08s}
.done .cb path{stroke-dashoffset:0}
.b{flex:1;min-width:0}.t{font-weight:600;font-size:16px;letter-spacing:-.2px}
.s{font-size:13px;color:var(--mut);margin-top:4px;display:flex;gap:7px;align-items:flex-start}
.s .dot{margin-top:5px;flex:none}
.dot{width:8px;height:8px;border-radius:2px;background:var(--c)}
.due{font-size:12px;font-weight:600;padding:5px 10px;background:rgba(255,255,255,.06);white-space:nowrap;color:#c9c9d0}
.due.today{background:rgba(10,132,255,.18);color:#5eb0ff}
.due.late{background:rgba(255,69,58,.16);color:#ff6961}
h2:first-child{margin-top:12px}
.rw{position:relative;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.swa{position:absolute;inset:0;display:none;align-items:center;font-weight:600;font-size:14px;padding:0 20px;color:#fff}
.rw.r .swa{display:flex;justify-content:flex-start;background:var(--ok);color:#000}
.rw.l .swa{display:flex;justify-content:flex-end;background:#ff453a}
.rw.drag .card,.rw.drag .sub{background:var(--bg)}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#2a2a30;border:1px solid var(--line);padding:11px 16px;gap:16px;align-items:center;font-size:14px;z-index:25;border-radius:14px;white-space:nowrap}
#toast.on{display:flex;animation:in .25s both}
#toast button{background:none;border:0;color:#5eb0ff;font-weight:600;cursor:pointer;padding:0}
.empty{text-align:center;color:var(--mut);padding:50px 20px;font-size:15px}
.fold{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;margin-top:14px;padding:6px 2px 8px;color:var(--mut);font-size:11.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;cursor:pointer}
.fold svg{width:16px;transition:transform .3s}.fold.open svg{transform:rotate(180deg)}
nav{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to bottom,transparent,var(--bg) 38%);border:0;border-radius:0;padding:14px 12px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.bar{position:relative;display:flex;max-width:760px;margin:0 auto}
.pill{flex:1;position:relative;z-index:1;border:0;background:none;padding:10px 2px 9px;font-weight:500;font-size:11px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.pill svg{width:22px;height:22px;flex:none}
.pill.on{color:var(--acc);font-weight:600}
.ind{position:absolute;top:0;left:0;width:25%;height:100%;border-radius:19px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transform:translateX(calc(var(--k,0)*100%));transition:transform .4s cubic-bezier(.4,0,.2,1)}
.fab{position:absolute;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));background:rgba(10,132,255,.2);border:1px solid rgba(10,132,255,.38);width:56px;height:56px;padding:0;font-size:30px;line-height:1;cursor:pointer;z-index:5}
.fab:hover{transform:rotate(90deg)}.fab:active{transform:scale(.92)}
.fab.hide{opacity:0;transform:scale(.6);pointer-events:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:#161619;border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;animation:up .32s cubic-bezier(.2,.9,.3,1);border-radius:26px 26px 0 0}
.grab{height:24px;margin:-14px 0 2px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.grab::before{content:"";width:36px;height:4px;background:#3a3a42;border-radius:2px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px;border-bottom:1px solid var(--line)}.grab{display:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{touch-action:none;margin:0 0 16px;font-size:21px;letter-spacing:-.4px}
.seg{display:flex;background:rgba(255,255,255,.05);padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:10px;font-weight:600;color:var(--mut);cursor:pointer}
.seg .on{background:var(--card2);color:var(--txt)}
label{display:block;font-size:11.5px;color:var(--mut);margin:16px 2px 7px;font-weight:600;letter-spacing:.8px}
input[type=text],.fld{width:100%;background:rgba(0,0,0,.35);border:1px solid #2c2c32;padding:14px;outline:none;text-align:left;cursor:pointer;display:block;transition:border-color .2s}
input:focus,.fld:hover{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--c);background:none;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--c);color:#000}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qk button{border:1px solid #2c2c32;background:none;padding:7px 11px;font-size:12px;color:var(--mut);cursor:pointer}
.qk button.on{border-color:var(--txt);color:var(--txt)}
.pov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.4);animation:fade .15s}
.pop{background:var(--card2);border:1px solid var(--line);padding:14px;width:min(320px,92vw);border-radius:22px;touch-action:pan-y;animation:pop .22s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(8px)}}
.ch{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px}
.ch button{background:none;border:0;font-size:22px;padding:2px 14px;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:13px}
.cg span{color:var(--mut);font-size:11px;padding:4px}
.cg button{aspect-ratio:1;border:0;background:none;cursor:pointer}
.cg button:hover{background:var(--card)}
.cg .sel{background:var(--acc)}.cg .td{box-shadow:inset 0 0 0 1px var(--mut)}
.go{width:100%;margin-top:20px;background:linear-gradient(145deg,#2e97ff,#0a72ff);border:0;padding:15px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 6px 20px rgba(10,132,255,.28),inset 0 1px 0 rgba(255,255,255,.25)}
.go:disabled{opacity:.3;box-shadow:none}
.go.sec{flex:none;width:auto;padding:15px 18px;background:var(--card2);box-shadow:none;border:1px solid var(--line)}
.go.dng{color:#ff6961}
.dn{display:flex;gap:10px;margin-top:20px}.dn .go{margin-top:0}
.pf{display:flex;align-items:center;gap:14px;padding:12px 2px;margin-top:4px}
.pf .av{width:58px;height:58px;font-size:22px;background:var(--acc);border:0}
.lr{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:13px 2px;margin:0;cursor:pointer;text-align:left;font-weight:600;font-size:16px}
.lr:active{background:rgba(255,255,255,.04)}
.lr span{flex:1}.lr em{font-style:normal;color:var(--mut);font-size:14px;font-weight:500}.lr b{color:var(--mut);font-size:20px;font-weight:500}
.back{background:none;border:0;color:var(--acc);font-weight:600;font-size:16px;padding:8px 4px;cursor:pointer}
.sub{display:flex;align-items:center;gap:12px;padding:8px 2px}
.sub .nm{flex:1;text-align:left;background:none;border:0;padding:6px 0;font-weight:500;cursor:pointer}
.sw{width:26px;height:26px;background:var(--c);border:0;cursor:pointer;flex:none}
.sw:hover{transform:scale(1.12)}.sw.cur{box-shadow:0 0 0 2px #17171a,0 0 0 3.5px var(--txt)}
.del{background:none;border:0;color:var(--mut);padding:6px;cursor:pointer;opacity:.5}.del:hover{opacity:1}.del svg{width:18px;display:block}
.pal{display:flex;gap:12px;flex-wrap:wrap}.pal .sw{width:34px;height:34px}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:6px;background:none;border:1px dashed #3a3a40;padding:14px;color:var(--acc);font-weight:600;font-size:15px;cursor:pointer}
.addrow:hover{border-color:var(--acc)}
.hint{font-size:12px;color:#ff6961;margin:8px 2px 0;min-height:15px}
.hist{opacity:.7}
.tm{display:grid;place-items:center;margin:18px 0 8px;position:relative}
.tm svg{max-width:100%;height:auto}
.rb{fill:none;stroke:rgba(255,255,255,.07);stroke-width:7}
.rg{fill:none;stroke:var(--c);stroke-width:7;stroke-linecap:round;stroke-dasharray:741.4;stroke-dashoffset:741.4;transition:stroke-dashoffset .3s linear}
.tt{position:absolute;text-align:center}
.tt div{font-size:56px;font-weight:600;letter-spacing:-2px;line-height:1}
.tt span{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:600;display:block;margin-top:8px}
.ftitle{text-align:center;font-weight:600;font-size:16px;margin:10px 0 4px;padding:0 10px}
.ctl{display:flex;gap:10px;margin-top:14px}.ctl .go{margin:0;flex:1}.ctl .go.sec{flex:none}
.ctr{justify-content:center;margin-top:14px}
.rad{width:18px;height:18px;border:2px solid var(--mut);flex:none}
.pk.sel{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 8px 22px rgba(0,0,0,.28)}
.pk.sel .rad{border-color:var(--c);background:var(--c);box-shadow:inset 0 0 0 3px #17171a}
.sj{display:block;font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--c);margin-bottom:3px}
.dds{display:grid;grid-template-columns:1fr 132px;gap:8px;margin-top:10px}
.ddw{position:relative;min-width:0}
.dd{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card2);border:0;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer;text-align:left;min-height:46px}
.dd svg{width:16px;flex:none;color:var(--mut)}
.dd .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:absolute;left:0;top:calc(100% + 6px);min-width:100%;z-index:8;background:#1b1b20;border:1px solid var(--line);max-height:320px;overflow-y:auto;padding:4px;animation:pop .18s both}
.menu.w{width:calc(100% + 140px)}
.mi{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 12px;cursor:pointer;font-weight:500;font-size:14px}
.mi:hover,.mi.on{background:rgba(255,255,255,.07)}
.act{text-align:center;max-width:100%;margin:20px auto -6px;padding:0 12px}.act .sj{font-size:10px;margin-bottom:3px}
.at{font-size:12.5px;color:#c9c9d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl2{display:flex;justify-content:center;gap:8px;margin-top:20px}
.mini{background:rgba(255,255,255,.05);border:1px solid var(--line);padding:9px 20px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}
.mini.pri{background:rgba(10,132,255,.16);border-color:rgba(10,132,255,.3);color:#5eb0ff}
.cb,.sw{border-radius:8px}.pal .sw{border-radius:12px}.st,.dot{border-radius:3px}.due{border-radius:10px}.mini,.go{border-radius:14px}.fab{border-radius:22px}.av{border-radius:14px}.pf .av{border-radius:20px}.cg button,.mi{border-radius:10px}.menu{border-radius:18px}.seg button{border-radius:10px}.chip,.qk button{border-radius:11px}.dd{border-radius:16px}.grid,.rw,.card,.lr,.sub,.pf{border-radius:0}.fold{border-radius:0}
.ind{display:none}
.pill{border-radius:18px}
.pill::before{display:none;content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.1);opacity:0;transform:scale(.7);transition:opacity .2s,transform .2s;z-index:-1}
.pill.on::before{opacity:1;transform:none;animation:popin .42s cubic-bezier(.3,1.5,.5,1)}
.pill.on svg{animation:ico .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes ico{0%{transform:scale(.7)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
.go{background:rgba(10,132,255,.16);color:#5eb0ff;border:1px solid rgba(10,132,255,.32);box-shadow:none;font-weight:600;font-size:15px;padding:13px}
.go:disabled{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--mut)}
.fab{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#7cc0ff;font-weight:300}
@media(min-width:700px) and (min-height:600px){
#app{max-width:none;padding-left:var(--sw)}
header{padding-left:max(20px,calc((100% - 760px)/2 + 4px));padding-right:max(20px,calc((100% - 760px)/2 + 4px))}
main{padding:6px max(16px,calc((100% - 760px)/2)) 110px}
nav{left:0;right:auto;top:0;bottom:0;width:var(--sw);border:0;border-right:1px solid var(--line);border-radius:0;box-shadow:none;background:rgba(9,9,11,.6);padding:28px 12px calc(20px + env(safe-area-inset-bottom,0px))}
.bar{flex-direction:column;max-width:none;margin:0}
.pill{flex:none;height:48px;padding:0 16px;flex-direction:row;justify-content:flex-start;gap:12px;text-align:left;font-size:15px}
.pill svg{width:20px;height:20px}
.ind{top:0;left:0;width:100%;height:48px;transform:translateY(calc(var(--k,0)*100%))}
#toast{bottom:calc(28px + env(safe-area-inset-bottom,0px));left:calc(50% + var(--sw)/2)}
.fab{right:max(24px,calc((100% - var(--sw) - 760px)/2 + 16px));bottom:calc(28px + env(safe-area-inset-bottom,0px))}
}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block;border-radius:0}
</style>
</head>
<body>
<div id="app">
<header><div><div class="kick" id="kick"></div><h1>Schulplaner</h1></div><div class="hr"><div class="st" title="Synchronisiert"></div><div class="av" id="hav">G</div></div></header>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Neue Aufgabe oder Test">+</button>
<nav><div class="bar"><i class="ind" id="ind"></i><button class="pill" data-k="hw" onclick="go('hw')" aria-label="Hausaufgaben"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6h10.5M9.5 12h10.5M9.5 18h10.5"/><path d="M3.8 6.2l1.3 1.3 2.3-2.5M3.8 12.2l1.3 1.3 2.3-2.5M3.8 18.2l1.3 1.3 2.3-2.5"/></svg><span>Hausaufgaben</span></button><button class="pill" data-k="tests" onclick="go('tests')" aria-label="Tests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Tests</span></button><button class="pill" data-k="focus" onclick="go('focus')" aria-label="Fokus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 3h5"/></svg><span>Fokus</span></button><button class="pill" data-k="pf" onclick="go('pf')" aria-label="Profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.7"/><path d="M4.5 20c.8-3.8 3.9-5.7 7.5-5.7s6.7 1.9 7.5 5.7"/></svg><span>Profil</span></button></div></nav>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const PAL=['#0a84ff','#ff453a','#bf5af2','#ff9f0a','#ffd60a','#30d158','#40c8e0','#ff375f','#5e5ce6','#ac8e68','#8ee05a','#ff7a45'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const off=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmt=s=>{const[y,m,d]=s.split('-');return `${+d}. ${MON[m-1].slice(0,3)}.`};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byD=(a,b)=>a.d.localeCompare(b.d);
function seed(){return{
subjects:[{n:'Mathe',c:PAL[0]},{n:'Deutsch',c:PAL[1]},{n:'Physik',c:PAL[2]},{n:'Englisch',c:PAL[3]},{n:'Geschichte',c:PAL[4]},{n:'Latein',c:PAL[5]},{n:'Biologie',c:PAL[6]}],
hw:[{id:uid(),t:'Aufgaben S. 84, Nr. 3–6',s:'Mathe',d:off(1),done:false},{id:uid(),t:'Vokabeln Lektion 27',s:'Latein',d:off(2),done:false},{id:uid(),t:'Standbild proben',s:'Deutsch',d:off(3),done:false},{id:uid(),t:'Protokoll Induktion',s:'Physik',d:off(-1),done:false},{id:uid(),t:'Worksheet 2 Mediation',s:'Englisch',d:off(0),done:true}],

const FO=25*60e3,BR=5*60e3,CIRC=741.4;

function updT(){if(!$('tt'))return;const ms=msNow(),pm=T.mode==='pomo';
$('tt').textContent=clk(ms);
$('tp').textContent=pm?(T.phase==='focus'?'Fokus':'Pause'):'Stoppuhr';
$('rg').style.display=pm?'':'none';if(pm)$('rg').style.strokeDashoffset=CIRC*ms/tot();
const started=pm?T.left<tot():T.acc>0;
$('tgo').textContent=T.run?'Pause':started?'Weiter':'Start'}

if(T.run){if(T.mode==='pomo')T.left=Math.max(0,T.end-n);else T.acc+=n-T.t0;T.run=false}
else{if(T.mode==='pomo')T.end=n+T.left;else T.t0=n;T.run=true;beep(0)}
render()}

function beep(f){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f?880:660;g.gain.value=.12;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+(f?.5:.08))}catch(e){}}
